{% extends "base.html" %}

{% block title %}{{head}}{% endblock title %}

{% block body %}

<h1 style="color:blue;">{{head}}</h1>

<form method="POST">
    

    <table>
            {% csrf_token %}
            {{form.as_table}}
    </table>
    <button type="submit">Go</button>

</form>
<a href={% url reverse %}>
    <p>{{reverse}}</p>
</a>
{% endblock body %}
